[package]
name = "rsc-storage"
version = "0.1.0"
edition = "2021"
authors = ["RSC Chain Team", "Steeve"]
description = "Persistencia física de bytes de RSC Chain"
license = "MIT"
publish = false

[dependencies]
rocksdb = { version = "=0.25.0", default-features = false, features = ["zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
