[package]
name = "rsc-bridge"
version = "0.1.0"
edition = "2021"
authors = ["RSC Chain Team", "Steeve"]
description = "Web Bridge de fichas de presencia RSC"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["limit", "timeout"] }
rsc-p2p = { path = "../rsc-p2p" }

[dev-dependencies]
libp2p = { version = "=0.57.0", default-features = false, features = ["ed25519"] }
