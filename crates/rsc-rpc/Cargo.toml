[package]
name = "rsc-rpc"
version = "0.1.0"
edition = "2021"
authors = ["RSC Chain Team", "Steeve"]
description = "JSON-RPC 2.0 HTTP para un nodo RSC"
license = "MIT"
publish = false

[features]
default = []
## Testnet only: expone rsc_adminRegisterAsset / rsc_adminCreditAsset (mint privilegiado).
amm-admin-rpc = []

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.6.11", features = ["cors", "limit", "timeout"] }
thiserror = "1.0.69"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
